schema_version: 1
bundle: dotfiles-workstation
stage: 2
intent: sanitized-portable-windows-ubuntu-wsl-and-neovim-replication
implemented_profile: base-config

fidelity_choices:
  selection_kind: pre-install human decision; never installer flags or state
  base-config:
    status: implemented
    contract: repository APT baseline, recorded Zsh downloads, and managed configuration
  compatible-toolchain:
    status: not-implemented
    future_requirements: separate reviewed installation with compatibility constraints and package source policy
  source-baseline:
    status: versioned-observed-reference
    date: 2026-09-11
    document: docs/source-baseline-2026-09-11.md
    semantics: target reference for separately reviewed reconciliation; not an automatic installation profile
    installer_flag: false
    unresolved_evidence:
      - source URLs
      - checksums or signatures
      - activation and rollback
      - ca-certificates version
      - win32yank.exe version

profile_contract:
  apt_baseline: installed after explicit approval
  recorded_zsh_downloads: cloned after explicit approval
  managed_configuration: five destinations with scoped snapshots
  optional_commands: configured only when present; binary installation deferred
  neovim_runtime_and_plugins: separate optional bootstrap and health scope
  starship_visual_baseline: minimal two-line Catppuccin Mocha prompt from ubuntu/config/starship.toml; external Powerline layouts are customization

scope:
  windows: manual-documentation-and-templates-only
  ubuntu_wsl: idempotent-agent-runnable-scripts
  neovim: full-lazyvim-personalization-with-preserved-activation-state
  technical_artifact_language: English

distribution:
  primary: Git clone or fetch from the canonical repository
  ordinary_zip_or_tar_export: not-primary
  normalized_archive_fallback:
    format: gzip-compressed-POSIX-tar
    metadata: numeric uid 0, numeric gid 0, epoch mtime, sorted tracked paths, no gzip timestamp
    command: >-
      git ls-files -z | tar -cf - --null --no-recursion --sort=name --mtime='@0'
      --owner=0 --group=0 --numeric-owner --format=posix
      --pax-option=delete=atime,delete=ctime --files-from=- | gzip -n > ../dotfiles-workstation.tar.gz

install_order:
  - windows/prerequisites
  - windows/warp-manual-setup
  - ubuntu/preflight
  - ubuntu/packages-after-human-approval
  - ubuntu/recorded-upstream-downloads-after-human-approval
  - ubuntu/managed-configurations-including-neovim
  - ubuntu/optional-login-shell-change-after-human-approval
  - no-network-verification

windows_manual_prerequisites:
  - WSL 2
  - Ubuntu on WSL
  - Warp for Windows
  - Hack Nerd Font Mono
windows_automation: prohibited

ubuntu_automated_components:
  apt_packages:
    - zsh
    - git
    - curl
    - ca-certificates
    - fzf
    - bat
    - fd-find
  recorded_upstreams:
    - name: oh-my-zsh
      source: https://github.com/ohmyzsh/ohmyzsh.git
      revision: master
      pin_status: floating-upstream-default-recorded
    - name: zsh-autosuggestions
      source: https://github.com/zsh-users/zsh-autosuggestions.git
      revision: v0.7.1
    - name: zsh-syntax-highlighting
      source: https://github.com/zsh-users/zsh-syntax-highlighting.git
      revision: 0.8.0
    - name: zsh-autocomplete
      source: https://github.com/marlonrichert/zsh-autocomplete.git
      revision: 24.09.04
  configured_optional_commands:
    - starship
    - atuin
    - zoxide
    - herdr
    - nvim
    - node
    - brew
    - win32yank.exe
    - colorls
  note: Optional command binaries are discovered at runtime and are not fetched by this stage.
  integration_exclusions:
    herdr: Herdr installation, Pi integration, audio backends, and agent or subagent lifecycle bridges

neovim_personalization:
  config_source: ubuntu/config/nvim
  framework: LazyVim
  plugin_manager: lazy.nvim
  fidelity_source_file_count: 49
  inventory: docs/nvim-configuration-inventory.md
  deferred_defects: docs/nvim-known-issues.md
  feature_groups:
    - markdown-render-preview-and-lint
    - treesitter-and-language-extras
    - themes-dashboard-statusline-and-navigation
    - oil-mini-files-snacks-picker-and-fzf-lua
    - git-minidiff-and-dap
    - obsidian-and-ai-provider-specifications
  activation_contract:
    preserve_negative_specs: true
    disabled_by_default:
      - avante.nvim
      - blink-cmp-copilot
      - claudecode.nvim
      - codecompanion.nvim
      - CopilotChat.nvim
      - copilot.lua
      - gemini-cli.nvim
      - obsidian.nvim
      - opencode.nvim
      - precognition.nvim
      - smear-cursor.nvim
  local_overrides:
    obsidian_path: DOTFILES_NVIM_OBSIDIAN_PATH
    obsidian_workspace: DOTFILES_NVIM_OBSIDIAN_WORKSPACE
    unresolved_behavior: leave-integration-disabled
  spell_dictionary:
    custom_source: ubuntu/config/nvim/spell/custom-words.txt
    generated_spl: prohibited
    bulk_system_dumps: prohibited
  lock_metadata: ubuntu/config/nvim/lazy-lock.json
  lock_metadata_adaptation: preserve-all-69-source-pins-and-add-published-explicit-minidiff-pin
  representation_adaptations:
    dashboard_header: quoted-padded-rows-joined-with-original-newline-semantics
  source_lock_pin_count: 69
  published_lock_pin_count: 70
  explicit_minidiff_pin_retained: true
  vendoring: prohibited
  runtime_discovery:
    homebrew: standard-linuxbrew-directory-then-executable-prefix-query
    node: environment-manager-bins-then-homebrew-prefix-then-PATH
    wsl_clipboard: source-behavior-preserved
  runtime_health_boundary:
    configuration_verification: managed tree equality and available Lua parsing only
    plugin_parser_and_mason_state: outside base-config install, verification, and rollback
    treesitter_reconciliation: targeted health check and parser repair before broad plugin updates

managed_destinations:
  - source: ubuntu/config/zsh/.zshrc
    destination: $HOME/.zshrc
    kind: file
  - source: ubuntu/config/starship.toml
    destination: ${XDG_CONFIG_HOME:-$HOME/.config}/starship.toml
    kind: file
  - source: ubuntu/config/atuin/config.toml
    destination: ${XDG_CONFIG_HOME:-$HOME/.config}/atuin/config.toml
    kind: file
  - source: ubuntu/config/herdr/config.toml
    destination: ${XDG_CONFIG_HOME:-$HOME/.config}/herdr/config.toml
    kind: file
  - source: ubuntu/config/nvim
    destination: ${XDG_CONFIG_HOME:-$HOME/.config}/nvim
    kind: directory

downloaded_dependency_root:
  destination: ${XDG_DATA_HOME:-$HOME/.local/share}/dotfiles-workstation/deps
  snapshot_policy: reproducible-downloads-not-copied-into-snapshots

excluded_sensitive_and_runtime_state:
  - shell command histories
  - Atuin account data and history databases
  - Warp account, workspace, telemetry, and session state
  - credentials, private keys, access tokens, and authentication files
  - AI/provider credentials, authentication files, histories, and runtime databases
  - personal vault paths and project paths (portable variable references are allowed)
  - generated spell dictionaries and bulk system dictionary exports
  - Neovim plugin checkouts and Mason installations under XDG data
  - Neovim state, history, sessions, logs, and caches under XDG state and cache
  - caches and downloaded package payloads
  - sockets, process identifiers, and lock files
  - logs and crash reports
  - backup archives from other installers
  - Git metadata copied from a source machine

human_approval_required:
  - Windows installation and settings changes
  - sudo and apt package installation
  - network downloads from recorded upstream repositories
  - optional isolated Neovim bootstrap download check
  - changing the Ubuntu login shell

verification_commands:
  - bash -n ubuntu/install.sh ubuntu/check-runtime.sh ubuntu/verify.sh ubuntu/rollback.sh ubuntu/lib/common.sh tests/run.sh tests/runtime-checks.sh tests/sanitize.sh tests/bootstrap.sh
  - tests/sanitize.sh
  - tests/runtime-checks.sh
  - tests/run.sh
  - ubuntu/verify.sh
optional_network_verification:
  command: tests/bootstrap.sh --approve-network
  isolation: temporary-HOME-and-all-XDG-runtime-roots

optional_runtime_diagnostics:
  command: ubuntu/check-runtime.sh
  document: docs/installation-runtime-remedies.md
  automatic_during_install: false
  default_mode: read-only
  isolation: temporary HOME and XDG config, state, and cache roots; existing real XDG data root
  existing_runtime_reads:
    - Neovim data site parser
    - nvim-treesitter plugin runtime and Vim highlights query
    - Mason bin Marksman fallback
  repair_boundary: one explicitly selected capability with matching approvals; outside managed snapshots
  full_toolchain_installer: false
  service_restarts: prohibited
  herdr_execution_and_state: prohibited

diagnostics_policy:
  redact_before_sharing_or_committing:
    - personal and machine-specific paths
    - credentials, tokens, and authentication material
    - shell histories and credential-bearing command output
  password_transport_to_agents: prohibited

rollback_contract:
  snapshot_root: $HOME/.dotfiles-workstation/backups/<timestamp>
  manifest: manifest.tsv
  manifest_fields:
    - destination
    - state
    - backup-relative-path
    - symlink-target-base64
  states:
    regular: restore the exact pre-install regular file from the self-contained payload
    symlink: recreate the symlink object from its captured target without dereferencing it
    absent: remove only the managed file created at that destination
    directory: restore the exact accepted regular-directory tree from the self-contained payload
    absent-directory: remove only the managed Neovim configuration directory created by that installation
  managed_preflight:
    timing: before packages, downloads, snapshots, or managed-config writes
    coverage: all managed sources, all current destinations, and recursive Neovim tree entries
    rejection_result: no managed destination or snapshot mutation
  directory_safety:
    accepted_entries:
      - regular files
      - directories
      - symlinks
    unsupported_entries: rejected before snapshot, replacement, or restoration
    replacement: sibling staging and displaced-directory recovery
  unchanged_bytes_and_tree: no snapshot entry and no backup payload
  list_command: ubuntu/rollback.sh --list
  restore_command: ubuntu/rollback.sh <timestamp>
  never_touched:
    - ${XDG_DATA_HOME:-$HOME/.local/share}/nvim
    - ${XDG_STATE_HOME:-$HOME/.local/state}/nvim
    - ${XDG_CACHE_HOME:-$HOME/.cache}/nvim
  limitation: downloaded dependency checkouts and apt packages are not removed
